[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-debate"
version = "0.1.0"
description = "A deterministic LangGraph debate pipeline core."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "langchain-ollama>=1.1,<2.0",
    "langgraph>=1.0,<2.0",
    "mcp>=2.0,<2.1",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
